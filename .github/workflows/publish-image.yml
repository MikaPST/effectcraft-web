name: Build and publish EffectCraft Web

on:
  schedule:
    # Weekly rebuild from upstream EffectCraft main (UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: effectcraft-web-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Resolve official upstream release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'effectcraft' };
            const result = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            const release = result.data;
            if (!release.tag_name) throw new Error('No upstream release tag found');
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', release.html_url);
            core.setOutput('body', release.body || '');
            core.setOutput('prerelease', String(release.prerelease));
            core.setOutput('published_at', release.published_at || '');
            core.setOutput('name', release.name || `effectcraft ${release.tag_name}`);

      - name: Check local release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !forced));

      - name: Check out EffectCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Record upstream revision
        if: steps.release-check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          echo "effectcraft_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "effectcraft_short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record upstream release commit for image tags
        if: steps.release-check.outputs.skip != 'true'
        id: release-source
        shell: bash
        run: |
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust and WebAssembly target
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        if: steps.release-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"

      - name: Install matching wasm-bindgen CLI
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          WASM_BINDGEN_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("upstream/Cargo.lock").read_text())
          versions = {
              pkg["version"]
              for pkg in lock["package"]
              if pkg["name"] == "wasm-bindgen"
          }
          if not versions:
              raise SystemExit("No wasm-bindgen package found in upstream/Cargo.lock")

          def version_key(version):
              return tuple(int(part) for part in version.split("-")[0].split("."))

          print(max(versions, key=version_key))
          PY
          )"
          echo "Installing wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build EffectCraft WebAssembly app
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cd upstream
          cargo xtask web

      - name: Prepare Docker build context and NGINX configuration
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          WEB_DIST="upstream/target/web/dist"
          test -f "${WEB_DIST}/index.html"
          test -f "${WEB_DIST}/effectcraft_web.js"
          test -f "${WEB_DIST}/worker.js"
          test -f "${WEB_DIST}/audio-worklet.js"
          test -f "${WEB_DIST}/sw.js"
          test -f "${WEB_DIST}/manifest.webmanifest"
          test -f "${WEB_DIST}/effectcraft_web_bg.wasm"

          mkdir -p docker-build/dist
          cp -a "${WEB_DIST}/." docker-build/dist/

          # Upstream assets use stable names; clients must revalidate on updates.
          cat > docker-build/nginx.conf <<'NGINX'
          server {
              listen 8080;
              listen [::]:8080;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              types {
                  application/wasm wasm;
                  text/javascript js;
                  text/html html;
                  application/manifest+json webmanifest;
              }

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types
                  application/wasm
                  application/javascript
                  text/javascript
                  application/manifest+json
                  text/css
                  text/html
                  application/json;

              location / {
                  try_files $uri $uri/ =404;
              }

              location = /index.html {
                  add_header Cache-Control "no-cache";
              }

              location = /sw.js {
                  add_header Cache-Control "no-cache";
              }

              location ~* \.(wasm|js)$ {
                  add_header Cache-Control "no-cache";
              }

              location = /manifest.webmanifest {
                  add_header Cache-Control "no-cache";
              }
          }
          NGINX

          cat > docker-build/Dockerfile <<'DOCKERFILE'
          FROM nginx:alpine

          ARG EFFECTCRAFT_COMMIT

          LABEL org.opencontainers.image.title="EffectCraft Web"
          LABEL org.opencontainers.image.description="Self-hosted browser build of EffectCraft"
          LABEL org.opencontainers.image.source="https://github.com/storytold/effectcraft"
          LABEL org.opencontainers.image.revision="${EFFECTCRAFT_COMMIT}"

          RUN rm -f /etc/nginx/conf.d/default.conf

          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY dist/ /usr/share/nginx/html/

          EXPOSE 8080
          DOCKERFILE

          echo "WebAssembly size:"
          du -h docker-build/dist/effectcraft_web_bg.wasm
          echo "Generated Docker build context:"
          find docker-build -maxdepth 2 -type f | sort | head -80

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.release-check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mikapst/effectcraft-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream-release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.effectcraft_short }}

      - name: Build and publish multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/docker-build
          file: ${{ github.workspace }}/docker-build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EFFECTCRAFT_COMMIT=${{ steps.source.outputs.effectcraft_sha }}

      - name: Create or update versioned GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.upstream-release.outputs.tag }}
          RELEASE_NAME: ${{ steps.upstream-release.outputs.name }}
          RELEASE_URL: ${{ steps.upstream-release.outputs.url }}
          RELEASE_NOTES: ${{ steps.upstream-release.outputs.body }}
          RELEASE_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          RELEASE_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          RELEASE_SOURCE_SHA: ${{ steps.release-source.outputs.short }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const image = 'ghcr.io/mikapst/effectcraft-web';
            const body = [
              `Community-maintained Docker packaging for **${process.env.RELEASE_NAME}**.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.RELEASE_SOURCE_SHA}\``,
              '',
              'Platforms: `linux/amd64`, `linux/arm64`.',
              '',
              `Official upstream release: ${process.env.RELEASE_URL}`,
              `Published upstream: ${process.env.RELEASE_PUBLISHED_AT || 'not specified'}`,
              '',
              `Upstream source commit: \`${process.env.RELEASE_SOURCE_SHA}\``,
              `Docker manifest digest: \`${process.env.RELEASE_DIGEST || 'not reported'}\``,
              '',
              '## Upstream release notes',
              process.env.RELEASE_NOTES || 'No release notes provided upstream.',
              '',
              'This is an independent Docker packaging release, not an official upstream distribution.'
            ].join('\n');
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: existing.id, name: 'EffectCraft Web ' + tag,
                body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            } else {
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: 'EffectCraft Web ' + tag, body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            }
